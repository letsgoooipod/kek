name: Build Chroma Patch

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid

      - name: Install iOS SDK
        run: |
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            --output /tmp/sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C $THEOS/sdks
          rm /tmp/sdk.tar.xz

      - name: Build .deb
        run: |
          gmake package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: chromapatch-deb
          path: packages/*.deb
          retention-days: 30
