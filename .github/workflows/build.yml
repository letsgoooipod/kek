name: Build Chroma Patch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bash curl sudo fakeroot make git libplist-utils xz-utils

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
        env:
          THEOS: /opt/theos

      - name: Install toolchain
        run: |
          curl -fsSL https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma -o toolchain.tar.lzma
          TMP=$(mktemp -d)
          tar --lzma -xf toolchain.tar.lzma -C $TMP
          mkdir -p $THEOS/toolchain/linux/iphone
          mv $TMP/ios-arm64e-clang-toolchain/* $THEOS/toolchain/linux/iphone/
          rm -rf toolchain.tar.lzma $TMP
        env:
          THEOS: /opt/theos

      - name: Install ldid
        run: |
          curl -fsSL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 \
            -o $THEOS/bin/ldid
          chmod +x $THEOS/bin/ldid
        env:
          THEOS: /opt/theos

      - name: Install iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          cd $THEOS/sdks
          xz -d iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar
          rm iPhoneOS16.5.sdk.tar
        env:
          THEOS: /opt/theos

      - name: Build .deb
        run: |
          export PATH=$THEOS/bin:$PATH
          make package FINALPACKAGE=1
        env:
          THEOS: /opt/theos

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: chromapatch-deb
          path: packages/*.deb
          retention-days: 30

