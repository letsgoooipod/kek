name: Build Chroma Patch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/theos/theos-builder:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .deb
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromapatch-deb
          path: packages/*.deb
          retention-days: 30
